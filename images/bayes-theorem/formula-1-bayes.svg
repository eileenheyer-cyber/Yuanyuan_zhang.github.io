<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" font-family="Inter, Arial, Helvetica, sans-serif">
  <title>Bayes’ theorem: the posterior P(A | B) equals the likelihood P(B | A) times the prior P(A), divided by the evidence P(B)</title>

  <g font-size="26" font-weight="600" fill="#0a3fb5" text-anchor="middle">
    <text x="135" y="62">posterior</text>
    <text x="450" y="62">likelihood</text>
    <text x="640" y="62">prior</text>
    <text x="540" y="326">evidence</text>
  </g>

  <g stroke="#6b7280" stroke-width="2" fill="#6b7280">
    <line x1="135" y1="80" x2="135" y2="126"/>
    <polygon points="129,124 141,124 135,138" stroke="none"/>
    <line x1="450" y1="80" x2="450" y2="100"/>
    <polygon points="444,98 456,98 450,112" stroke="none"/>
    <line x1="640" y1="80" x2="640" y2="100"/>
    <polygon points="634,98 646,98 640,112" stroke="none"/>
    <line x1="540" y1="296" x2="540" y2="258"/>
    <polygon points="534,260 546,260 540,246" stroke="none"/>
  </g>

  <g font-size="42" font-style="italic" fill="#111" text-anchor="middle">
    <text x="135" y="192">P(A | B) =</text>
    <text x="450" y="160">P(B | A)</text>
    <text x="562" y="160" font-style="normal">×</text>
    <text x="640" y="160">P(A)</text>
    <text x="540" y="228">P(B)</text>
  </g>
  <line x1="340" y1="178" x2="740" y2="178" stroke="#6b7280" stroke-width="2"/>
</svg>
