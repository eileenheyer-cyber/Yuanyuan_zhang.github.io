<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" width="800" height="410" font-family="Inter, Arial, Helvetica, sans-serif">
  <title>Of 10,000 payments, 288 trigger a fraud alert, but only 90 of them are real fraud</title>
  <g stroke="#9aa0ad" stroke-width="1.5" fill="none">
    <path d="M400 62 V84 H240 V108"/>
    <path d="M400 84 H580 V108"/>
    <path d="M240 164 V186 H160 V208"/>
    <path d="M240 186 H320 V208"/>
    <path d="M580 164 V186 H500 V208"/>
    <path d="M580 186 H660 V208"/>
  </g>

  <rect x="310" y="22" width="180" height="40" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
  <text x="400" y="48" text-anchor="middle" font-size="16" font-weight="600" fill="#111">10,000 payments</text>

  <rect x="120" y="108" width="240" height="56" fill="#0a3fb5"/>
  <text x="240" y="132" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">100 fraud</text>
  <text x="240" y="152" text-anchor="middle" font-size="13" fill="#d9e0f3">1% of payments</text>

  <rect x="460" y="108" width="240" height="56" fill="#e4e4e8"/>
  <text x="580" y="132" text-anchor="middle" font-size="16" font-weight="700" fill="#111">9,900 normal</text>
  <text x="580" y="152" text-anchor="middle" font-size="13" fill="#555">99% of payments</text>

  <rect x="90" y="208" width="140" height="56" fill="#ffffff" stroke="#0a3fb5" stroke-width="2.5"/>
  <text x="160" y="232" text-anchor="middle" font-size="16" font-weight="700" fill="#0a3fb5">90 alert</text>
  <text x="160" y="251" text-anchor="middle" font-size="12" fill="#555">true positives (90%)</text>

  <rect x="250" y="208" width="140" height="56" fill="#f4f5f8" stroke="#c9ccd6" stroke-width="1"/>
  <text x="320" y="232" text-anchor="middle" font-size="16" font-weight="600" fill="#555">10 no alert</text>
  <text x="320" y="251" text-anchor="middle" font-size="12" fill="#777">missed fraud</text>

  <rect x="430" y="208" width="140" height="56" fill="#ffffff" stroke="#111" stroke-width="2.5"/>
  <text x="500" y="232" text-anchor="middle" font-size="16" font-weight="700" fill="#111">198 alert</text>
  <text x="500" y="251" text-anchor="middle" font-size="12" fill="#555">false alarms (2%)</text>

  <rect x="590" y="208" width="140" height="56" fill="#f4f5f8" stroke="#c9ccd6" stroke-width="1"/>
  <text x="660" y="232" text-anchor="middle" font-size="16" font-weight="600" fill="#555">9,702 no alert</text>
  <text x="660" y="251" text-anchor="middle" font-size="12" fill="#777">correctly passed</text>

  <text x="100" y="312" font-size="13" font-weight="600" letter-spacing="0.8" fill="#111">ALL 288 ALERTS</text>
  <rect x="100" y="324" width="187.5" height="44" fill="#0a3fb5"/>
  <rect x="287.5" y="324" width="412.5" height="44" fill="#e4e4e8"/>
  <text x="193.75" y="351" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">90 real fraud</text>
  <text x="493.75" y="351" text-anchor="middle" font-size="14" font-weight="600" fill="#111">198 false alarms</text>
  <text x="700" y="312" text-anchor="end" font-size="14" font-weight="700" fill="#0a3fb5">90 ÷ 288 ≈ 31.3%</text>
</svg>
