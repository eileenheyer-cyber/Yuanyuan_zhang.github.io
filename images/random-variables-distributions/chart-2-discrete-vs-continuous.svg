<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260" font-family="Inter, Arial, Helvetica, sans-serif">
  <title>Discrete variables take separate countable values, continuous variables can take any value in a range</title>
  <text x="210" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#111">Discrete: countable values</text>
  <text x="210" y="62" text-anchor="middle" font-size="13" font-weight="400" fill="#555">a count</text>
  <text x="590" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#111">Continuous: any value in a range</text>
  <text x="590" y="62" text-anchor="middle" font-size="13" font-weight="400" fill="#555">a measurement</text>
  <line x1="60" y1="150" x2="360" y2="150" stroke="#111" stroke-width="2"/>
  <line x1="60" y1="144" x2="60" y2="156" stroke="#111" stroke-width="1.5"/>
  <circle cx="60" cy="150" r="9" fill="#0a3fb5"/>
  <text x="60" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#111">0</text>
  <line x1="110" y1="144" x2="110" y2="156" stroke="#111" stroke-width="1.5"/>
  <circle cx="110" cy="150" r="9" fill="#0a3fb5"/>
  <text x="110" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#111">1</text>
  <line x1="160" y1="144" x2="160" y2="156" stroke="#111" stroke-width="1.5"/>
  <circle cx="160" cy="150" r="9" fill="#0a3fb5"/>
  <text x="160" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#111">2</text>
  <line x1="210" y1="144" x2="210" y2="156" stroke="#111" stroke-width="1.5"/>
  <circle cx="210" cy="150" r="9" fill="#0a3fb5"/>
  <text x="210" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#111">3</text>
  <line x1="260" y1="144" x2="260" y2="156" stroke="#111" stroke-width="1.5"/>
  <circle cx="260" cy="150" r="9" fill="#0a3fb5"/>
  <text x="260" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#111">4</text>
  <line x1="310" y1="144" x2="310" y2="156" stroke="#111" stroke-width="1.5"/>
  <circle cx="310" cy="150" r="9" fill="#0a3fb5"/>
  <text x="310" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#111">5</text>
  <line x1="360" y1="144" x2="360" y2="156" stroke="#111" stroke-width="1.5"/>
  <circle cx="360" cy="150" r="9" fill="#0a3fb5"/>
  <text x="360" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#111">6</text>
  <text x="210" y="214" text-anchor="middle" font-size="13" font-weight="600" fill="#111">Clicks in the first hour</text>
  <text x="210" y="238" text-anchor="middle" font-size="12.5" font-weight="400" fill="#555">Gaps in between: there is no such thing as 2.5 clicks</text>
  <rect x="440" y="146" width="300" height="8" fill="#0a3fb5" rx="4"/>
  <line x1="440" y1="142" x2="440" y2="162" stroke="#111" stroke-width="1.5"/>
  <text x="440" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#111">1</text>
  <line x1="500" y1="142" x2="500" y2="162" stroke="#111" stroke-width="1.5"/>
  <text x="500" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#111">2</text>
  <line x1="560" y1="142" x2="560" y2="162" stroke="#111" stroke-width="1.5"/>
  <text x="560" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#111">3</text>
  <line x1="620" y1="142" x2="620" y2="162" stroke="#111" stroke-width="1.5"/>
  <text x="620" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#111">4</text>
  <line x1="680" y1="142" x2="680" y2="162" stroke="#111" stroke-width="1.5"/>
  <text x="680" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#111">5</text>
  <line x1="740" y1="142" x2="740" y2="162" stroke="#111" stroke-width="1.5"/>
  <text x="740" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#111">6</text>
  <polygon points="569.2,118 583.2,118 576.2,132" fill="#111"/>
  <text x="576.2" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#111">3.27</text>
  <text x="590" y="214" text-anchor="middle" font-size="13" font-weight="600" fill="#111">Time on the landing page (minutes)</text>
  <text x="590" y="238" text-anchor="middle" font-size="12.5" font-weight="400" fill="#555">No gaps: every value in between is possible</text>

</svg>
