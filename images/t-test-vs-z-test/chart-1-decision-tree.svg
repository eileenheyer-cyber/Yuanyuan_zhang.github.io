<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Decision tree: if you compare a share, use a z-test for proportions. If you compare an average and the population standard deviation is known, use a z-test; if it is estimated from the sample, which is the usual case, use a t-test.">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0a0a0a"/></marker>
  </defs>
  <g font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" fill="#0a0a0a" text-anchor="middle">
    <!-- connectors -->
    <g stroke="#0a0a0a" stroke-width="2" fill="none" marker-end="url(#arr)">
      <path d="M340 84 L175 140"/>
      <path d="M460 84 L600 140"/>
      <path d="M175 214 L175 376"/>
      <path d="M600 214 L600 266"/>
      <path d="M520 330 L450 376"/>
      <path d="M680 330 L690 376"/>
    </g>
    <!-- start -->
    <rect x="260" y="20" width="280" height="64" fill="#e9e1cd" stroke="#0a0a0a" stroke-width="2"/>
    <text x="400" y="59" font-weight="700">What are you comparing?</text>
    <!-- level 2 -->
    <rect x="40" y="140" width="270" height="74" fill="#e9e1cd" stroke="#0a0a0a" stroke-width="2"/>
    <text x="175" y="173" font-weight="700">A share (proportion)</text>
    <text x="175" y="198" font-size="17">e.g. conversion rate</text>
    <rect x="465" y="140" width="270" height="74" fill="#e9e1cd" stroke="#0a0a0a" stroke-width="2"/>
    <text x="600" y="173" font-weight="700">An average (mean)</text>
    <text x="600" y="198" font-size="17">e.g. revenue per user</text>
    <!-- question -->
    <rect x="440" y="266" width="320" height="64" fill="#e9e1cd" stroke="#0a0a0a" stroke-width="2"/>
    <text x="600" y="293">Is the population standard</text>
    <text x="600" y="316">deviation known?</text>
    <text x="458" y="352" font-weight="700" text-anchor="end" font-size="17">Yes</text>
    <text x="702" y="352" font-weight="700" text-anchor="start" font-size="17">No</text>
    <!-- results -->
    <rect x="40" y="376" width="270" height="94" fill="#dc452d"/>
    <text x="175" y="413" fill="#ffffff" font-weight="700" font-size="21">Z-test</text>
    <text x="175" y="440" fill="#ffffff" font-size="17">for proportions</text>
    <rect x="360" y="376" width="180" height="94" fill="#dc452d"/>
    <text x="450" y="413" fill="#ffffff" font-weight="700" font-size="21">Z-test</text>
    <text x="450" y="440" fill="#ffffff" font-size="17">for means</text>
    <rect x="590" y="376" width="180" height="94" fill="#1d57b5"/>
    <text x="680" y="413" fill="#ffffff" font-weight="700" font-size="21">T-test</text>
    <text x="680" y="440" fill="#ffffff" font-size="17">Welch's for 2 groups</text>
  </g>
</svg>
