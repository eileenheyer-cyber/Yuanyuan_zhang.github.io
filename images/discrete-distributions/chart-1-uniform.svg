  <rect x="222.9" y="113.3" width="69.2" height="146.7" fill="#0a3fb5"/>
  <text x="257.5" y="106.3" text-anchor="middle" font-size="12" font-weight="600" fill="#111">16.7%</text>
  <text x="257.5" y="282" text-anchor="middle" font-size="13" font-weight="500" fill="#111">2</text>
  <rect x="334.6" y="113.3" width="69.2" height="146.7" fill="#0a3fb5"/>
  <text x="369.2" y="106.3" text-anchor="middle" font-size="12" font-weight="600" fill="#111">16.7%</text>
  <text x="369.2" y="282" text-anchor="middle" font-size="13" font-weight="500" fill="#111">3</text>
  <rect x="446.2" y="113.3" width="69.2" height="146.7" fill="#0a3fb5"/>
  <text x="480.8" y="106.3" text-anchor="middle" font-size="12" font-weight="600" fill="#111">16.7%</text>
