<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" font-family="Inter, Arial, Helvetica, sans-serif">
  <title>Bernoulli distribution: one trial with success probability p and failure probability 1 minus p</title>
  <text x="400" y="36" text-anchor="middle" font-size="15" font-weight="700" fill="#111">One customer, one email: opened or not?</text>
  <circle cx="260" cy="120" r="56" fill="#0a3fb5"/>
  <text x="260" y="126" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">p = 0.30</text>
  <text x="260" y="210" text-anchor="middle" font-size="15" font-weight="600" fill="#111">Opened</text>
  <circle cx="540" cy="120" r="56" fill="#c9ccd6"/>
  <text x="540" y="126" text-anchor="middle" font-size="18" font-weight="700" fill="#111">1 − p = 0.70</text>
  <text x="540" y="210" text-anchor="middle" font-size="15" font-weight="600" fill="#111">Not opened</text>
  <text x="400" y="250" text-anchor="middle" font-size="13" font-weight="400" fill="#555">Only two outcomes, and their probabilities add up to 1</text>

</svg>
