  <rect x="549.7" y="194.7" width="8.3" height="0.3" fill="#e8a900"/>
  <line x1="421" y1="195" x2="565" y2="195" stroke="#111" stroke-width="1.5"/>
  <rect x="600" y="20" width="175" height="200" fill="#f4f5f8" stroke="#c9ccd6" stroke-width="1.2"/>
  <text x="688" y="48" text-anchor="middle" font-size="16" font-weight="700" fill="#111">Poisson</text>
  <text x="688" y="68" text-anchor="middle" font-size="11.5" font-weight="400" fill="#555">events per interval</text>
  <rect x="622.0" y="152.1" width="12.9" height="42.9" fill="#d9432b"/>
  <rect x="638.9" y="109.3" width="12.9" height="85.7" fill="#d9432b"/>
