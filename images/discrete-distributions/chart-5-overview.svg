  <text x="298" y="48" text-anchor="middle" font-size="16" font-weight="700" fill="#111">Bernoulli</text>
  <text x="298" y="68" text-anchor="middle" font-size="11.5" font-weight="400" fill="#555">one trial</text>
  <rect x="232.0" y="111.9" width="63.5" height="83.1" fill="#d9432b"/>
  <rect x="299.5" y="159.4" width="63.5" height="35.6" fill="#d9432b"/>
  <line x1="226" y1="195" x2="370" y2="195" stroke="#111" stroke-width="1.5"/>
  <rect x="405" y="20" width="175" height="200" fill="#f4f5f8" stroke="#c9ccd6" stroke-width="1.2"/>
  <text x="493" y="48" text-anchor="middle" font-size="16" font-weight="700" fill="#111">Binomial</text>
  <text x="493" y="68" text-anchor="middle" font-size="11.5" font-weight="400" fill="#555">successes in n trials</text>
  <rect x="427.0" y="194.7" width="8.3" height="0.3" fill="#e8a900"/>
