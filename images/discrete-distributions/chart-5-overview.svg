  <text x="297" y="240" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111">p and 1 − p</text>
  <text x="492" y="240" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111">n trials, same p</text>
  <text x="687" y="240" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111">known average λ</text>

</svg>
