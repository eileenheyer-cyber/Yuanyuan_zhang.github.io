  <text x="103" y="48" text-anchor="middle" font-size="16" font-weight="700" fill="#111">Uniform</text>
  <text x="103" y="68" text-anchor="middle" font-size="11.5" font-weight="400" fill="#555">all equally likely</text>
  <rect x="37.0" y="142.2" width="18.5" height="52.8" fill="#0a3fb5"/>
