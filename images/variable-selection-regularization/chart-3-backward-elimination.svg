<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-label="Diagram: a grid of 20 candidate predictors passes through a funnel labeled backward elimination, which removes the least useful predictor at a time, into a box listing the eight remaining predictors: purchase frequency, average order value, loyalty member, site visits, wishlist items, distance to store, newsletter sign-up and coupon uses. Hollow circles are numbered 1 to 12 in the order they were removed, starting with customer ID." font-family="Inter, system-ui, sans-serif">
<rect width="600" height="300" fill="#ffffff"/>
<text x="20" y="34" font-size="13" font-weight="700" fill="#0a0a0a">20 candidate predictors</text>
<circle cx="34" cy="72" r="15" fill="#1d57b5"/>
<circle cx="72" cy="72" r="15" fill="#1d57b5"/>
<circle cx="110" cy="72" r="15" fill="#fff" stroke="#8a8a8a" stroke-width="1.5"/><text x="110" y="76.5" font-size="12.5" font-weight="600" fill="#8a8a8a" text-anchor="middle">2</text>
<circle cx="148" cy="72" r="15" fill="#1d57b5"/>
<circle cx="186" cy="72" r="15" fill="#fff" stroke="#8a8a8a" stroke-width="1.5"/><text x="186" y="76.5" font-size="12.5" font-weight="600" fill="#8a8a8a" text-anchor="middle">11</text>
<circle cx="34" cy="116" r="15" fill="#fff" stroke="#8a8a8a" stroke-width="1.5"/><text x="34" y="120.5" font-size="12.5" font-weight="600" fill="#8a8a8a" text-anchor="middle">1</text>
<circle cx="72" cy="116" r="15" fill="#1d57b5"/>
<circle cx="110" cy="116" r="15" fill="#fff" stroke="#8a8a8a" stroke-width="1.5"/><text x="110" y="120.5" font-size="12.5" font-weight="600" fill="#8a8a8a" text-anchor="middle">10</text>
<circle cx="148" cy="116" r="15" fill="#fff" stroke="#8a8a8a" stroke-width="1.5"/><text x="148" y="120.5" font-size="12.5" font-weight="600" fill="#8a8a8a" text-anchor="middle">9</text>
<circle cx="186" cy="116" r="15" fill="#1d57b5"/>
<circle cx="34" cy="160" r="15" fill="#fff" stroke="#8a8a8a" stroke-width="1.5"/><text x="34" y="164.5" font-size="12.5" font-weight="600" fill="#8a8a8a" text-anchor="middle">8</text>
<circle cx="72" cy="160" r="15" fill="#fff" stroke="#8a8a8a" stroke-width="1.5"/><text x="72" y="164.5" font-size="12.5" font-weight="600" fill="#8a8a8a" text-anchor="middle">5</text>
<circle cx="110" cy="160" r="15" fill="#fff" stroke="#8a8a8a" stroke-width="1.5"/><text x="110" y="164.5" font-size="12.5" font-weight="600" fill="#8a8a8a" text-anchor="middle">12</text>
<circle cx="148" cy="160" r="15" fill="#1d57b5"/>
<circle cx="186" cy="160" r="15" fill="#1d57b5"/>
<circle cx="34" cy="204" r="15" fill="#1d57b5"/>
<circle cx="72" cy="204" r="15" fill="#fff" stroke="#8a8a8a" stroke-width="1.5"/><text x="72" y="208.5" font-size="12.5" font-weight="600" fill="#8a8a8a" text-anchor="middle">7</text>
<circle cx="110" cy="204" r="15" fill="#fff" stroke="#8a8a8a" stroke-width="1.5"/><text x="110" y="208.5" font-size="12.5" font-weight="600" fill="#8a8a8a" text-anchor="middle">4</text>
<circle cx="148" cy="204" r="15" fill="#fff" stroke="#8a8a8a" stroke-width="1.5"/><text x="148" y="208.5" font-size="12.5" font-weight="600" fill="#8a8a8a" text-anchor="middle">6</text>
<circle cx="186" cy="204" r="15" fill="#fff" stroke="#8a8a8a" stroke-width="1.5"/><text x="186" y="208.5" font-size="12.5" font-weight="600" fill="#8a8a8a" text-anchor="middle">3</text>
<text x="20" y="262" font-size="12" fill="#0a0a0a">Blue = remaining after elimination</text>
<text x="20" y="280" font-size="12" fill="#0a0a0a">Number = order of removal</text>
<polygon points="216,56 336,112 336,208 216,264" fill="#e9e1cd"/>
<text x="276" y="126" font-size="12.5" font-weight="600" fill="#0a0a0a" text-anchor="middle">Backward</text>
<text x="276" y="142" font-size="12.5" font-weight="600" fill="#0a0a0a" text-anchor="middle">elimination</text>
<text x="276" y="162" font-size="12" fill="#0a0a0a" text-anchor="middle">removes the least</text>
<text x="276" y="178" font-size="12" fill="#0a0a0a" text-anchor="middle">useful predictor</text>
<text x="276" y="194" font-size="12" fill="#0a0a0a" text-anchor="middle">at a time</text>
<rect x="352" y="56" width="240" height="208" fill="#fff" stroke="#0a0a0a" stroke-width="1.5"/>
<text x="364" y="34" font-size="13" font-weight="700" fill="#0a0a0a">8 remaining predictors</text>
<circle cx="372" cy="80" r="6" fill="#1d57b5"/><text x="388" y="84" font-size="13" fill="#0a0a0a">Purchase frequency</text>
<circle cx="372" cy="102" r="6" fill="#1d57b5"/><text x="388" y="106" font-size="13" fill="#0a0a0a">Average order value</text>
<circle cx="372" cy="124" r="6" fill="#1d57b5"/><text x="388" y="128" font-size="13" fill="#0a0a0a">Loyalty member</text>
<circle cx="372" cy="146" r="6" fill="#1d57b5"/><text x="388" y="150" font-size="13" fill="#0a0a0a">Site visits</text>
<circle cx="372" cy="168" r="6" fill="#1d57b5"/><text x="388" y="172" font-size="13" fill="#0a0a0a">Wishlist items</text>
<circle cx="372" cy="190" r="6" fill="#1d57b5"/><text x="388" y="194" font-size="13" fill="#0a0a0a">Distance to store</text>
<circle cx="372" cy="212" r="6" fill="#1d57b5"/><text x="388" y="216" font-size="13" fill="#0a0a0a">Newsletter sign-up</text>
<circle cx="372" cy="234" r="6" fill="#1d57b5"/><text x="388" y="238" font-size="13" fill="#0a0a0a">Coupon uses</text>
</svg>