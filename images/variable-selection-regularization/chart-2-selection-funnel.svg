<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-label="Twenty candidate predictors narrow to eight selected predictors through forward selection. The eight kept predictors, in order of entry: purchase frequency, site visits, average order value, loyalty member, coupon uses, distance to store, newsletter sign-up and wishlist items." font-family="Inter, system-ui, sans-serif">
<rect width="600" height="300" fill="#ffffff"/>
<text x="20" y="34" font-size="13" font-weight="700" fill="#0a0a0a">20 candidate predictors</text>
<circle cx="34" cy="72" r="15" fill="#1d57b5"/><text x="34" y="76.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<circle cx="72" cy="72" r="15" fill="#1d57b5"/><text x="72" y="76.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<circle cx="110" cy="72" r="15" fill="#fff" stroke="#8a8a8a" stroke-width="1.5"/>
<circle cx="148" cy="72" r="15" fill="#1d57b5"/><text x="148" y="76.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<circle cx="186" cy="72" r="15" fill="#fff" stroke="#8a8a8a" stroke-width="1.5"/>
<circle cx="34" cy="116" r="15" fill="#fff" stroke="#8a8a8a" stroke-width="1.5"/>
<circle cx="72" cy="116" r="15" fill="#1d57b5"/><text x="72" y="120.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<circle cx="110" cy="116" r="15" fill="#fff" stroke="#8a8a8a" stroke-width="1.5"/>
<circle cx="148" cy="116" r="15" fill="#fff" stroke="#8a8a8a" stroke-width="1.5"/>
<circle cx="186" cy="116" r="15" fill="#1d57b5"/><text x="186" y="120.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">8</text>
<circle cx="34" cy="160" r="15" fill="#fff" stroke="#8a8a8a" stroke-width="1.5"/>
<circle cx="72" cy="160" r="15" fill="#fff" stroke="#8a8a8a" stroke-width="1.5"/>
<circle cx="110" cy="160" r="15" fill="#fff" stroke="#8a8a8a" stroke-width="1.5"/>
<circle cx="148" cy="160" r="15" fill="#1d57b5"/><text x="148" y="164.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">6</text>
<circle cx="186" cy="160" r="15" fill="#1d57b5"/><text x="186" y="164.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">7</text>
<circle cx="34" cy="204" r="15" fill="#1d57b5"/><text x="34" y="208.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">5</text>
<circle cx="72" cy="204" r="15" fill="#fff" stroke="#8a8a8a" stroke-width="1.5"/>
<circle cx="110" cy="204" r="15" fill="#fff" stroke="#8a8a8a" stroke-width="1.5"/>
<circle cx="148" cy="204" r="15" fill="#fff" stroke="#8a8a8a" stroke-width="1.5"/>
<circle cx="186" cy="204" r="15" fill="#fff" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="20" y="262" font-size="12" fill="#0a0a0a">Blue = kept, numbered in order of entry</text>
<text x="20" y="280" font-size="12" fill="#0a0a0a">Hollow = never entered (incl. age, customer ID)</text>
<polygon points="216,56 336,112 336,208 216,264" fill="#e9e1cd"/>
<text x="276" y="150" font-size="12.5" font-weight="600" fill="#0a0a0a" text-anchor="middle">Forward selection</text>
<text x="276" y="168" font-size="12" fill="#0a0a0a" text-anchor="middle">adds the best</text>
<text x="276" y="184" font-size="12" fill="#0a0a0a" text-anchor="middle">predictor at a time</text>
<rect x="352" y="56" width="240" height="208" fill="#fff" stroke="#0a0a0a" stroke-width="1.5"/>
<text x="364" y="34" font-size="13" font-weight="700" fill="#0a0a0a">8 selected predictors</text>
<circle cx="372" cy="78" r="8" fill="#1d57b5"/><text x="372" y="82" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<text x="388" y="82" font-size="13" fill="#0a0a0a">Purchase frequency</text>
<circle cx="372" cy="100" r="8" fill="#1d57b5"/><text x="372" y="104" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<text x="388" y="104" font-size="13" fill="#0a0a0a">Site visits</text>
<circle cx="372" cy="122" r="8" fill="#1d57b5"/><text x="372" y="126" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<text x="388" y="126" font-size="13" fill="#0a0a0a">Average order value</text>
<circle cx="372" cy="144" r="8" fill="#1d57b5"/><text x="372" y="148" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<text x="388" y="148" font-size="13" fill="#0a0a0a">Loyalty member</text>
<circle cx="372" cy="166" r="8" fill="#1d57b5"/><text x="372" y="170" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">5</text>
<text x="388" y="170" font-size="13" fill="#0a0a0a">Coupon uses</text>
<circle cx="372" cy="188" r="8" fill="#1d57b5"/><text x="372" y="192" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">6</text>
<text x="388" y="192" font-size="13" fill="#0a0a0a">Distance to store</text>
<circle cx="372" cy="210" r="8" fill="#1d57b5"/><text x="372" y="214" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">7</text>
<text x="388" y="214" font-size="13" fill="#0a0a0a">Newsletter sign-up</text>
<circle cx="372" cy="232" r="8" fill="#1d57b5"/><text x="372" y="236" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">8</text>
<text x="388" y="236" font-size="13" fill="#0a0a0a">Wishlist items</text>
</svg>